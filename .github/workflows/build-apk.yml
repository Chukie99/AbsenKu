name: Build APK

on:
  push:
    paths:
      - "android/**"
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.7

      - name: Build release APK
        env:
          ORG_GRADLE_PROJECT_cdnSupportsFailingBuildType: "true"
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease \
            -Dorg.gradle.jvmargs="-Xmx4096m -Dfile.encoding=UTF-8" \
            --no-daemon \
            -Pandroid.builder.sdkDownload=true \
            -Pandroid.builder.skipAdbInstall=true

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: absenku-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Release APK (on GitHub Release)
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: android/app/build/outputs/apk/release/app-release.apk
          asset_name: AbsenKu-v2.0.0.apk
          asset_content_type: application/vnd.android.package.archive
