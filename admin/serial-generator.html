<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AbsenKu — Serial Number Generator</title>
  <style>
    :root {
      --primary: #2563EB;
      --primary-light: #EFF6FF;
      --primary-hover: #1D4ED8;
      --secondary: #059669;
      --secondary-hover: #047857;
      --surface: #ffffff;
      --background: #F8FAFC;
      --text-primary: #0F172A;
      --text-secondary: #64748B;
      --error: #DC2626;
      --error-bg: #FEF2F2;
      --border: #E2E8F0;
      --border-focus: #93C5FD;
      --radius: 10px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--background);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 32px 16px;
      line-height: 1.5;
    }

    /* --- password gate --- */
    .gate-wrapper {
      width: 100%; max-width: 380px; margin-top: 80px;
    }
    .gate-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      padding: 28px 24px 24px;
    }
    .gate-card h2 {
      font-size: 16px; font-weight: 600; margin-bottom: 4px;
    }
    .gate-card .gate-sub {
      font-size: 13px; color: var(--text-secondary); margin-bottom: 18px;
    }
    .gate-card input {
      width: 100%; padding: 10px 12px;
      border: 1.5px solid var(--border); border-radius: 8px;
      font-size: 14px; margin-bottom: 14px;
    }
    .gate-card input:focus {
      outline: none; border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }
    .gate-card button {
      width: 100%; padding: 10px 0; border: none; border-radius: 8px;
      background: var(--primary); color: #fff;
      font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .gate-card button:hover { background: var(--primary-hover); }
    .gate-error {
      color: var(--error); font-size: 12px; margin-top: 10px;
      min-height: 16px;
    }

    /* --- main tool --- */
    .tool-wrapper { display: none; width: 100%; max-width: 420px; }
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      padding: 24px 22px 20px;
      width: 100%;
    }
    .header { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .header .icon {
      width: 32px; height: 32px; border-radius: 8px;
      background: var(--primary-light); color: var(--primary);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 700; flex-shrink: 0;
    }
    h1 { font-size: 18px; font-weight: 700; }
    p.lead {
      font-size: 13px; color: var(--text-secondary);
      margin-bottom: 18px; padding-left: 42px;
    }
    label {
      font-size: 13px; font-weight: 500; color: var(--text-secondary);
      display: block; margin-bottom: 6px;
    }
    input[type=text], input[type=password] {
      width: 100%; padding: 10px 12px;
      border: 1.5px solid var(--border); border-radius: 8px;
      font-size: 14px;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    }
    input[type=text]:focus, input[type=password]:focus {
      outline: none; border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }
    .row {
      display: flex; gap: 10px; margin-top: 16px; align-items: stretch;
    }
    button {
      border: none; border-radius: 8px; font-size: 14px;
      font-weight: 600; cursor: pointer; transition: background 0.15s;
      padding: 10px 16px;
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-generate { flex: 1; background: var(--primary); color: #fff; }
    .btn-generate:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-copy {
      background: #F1F5F9; color: var(--text-primary); border: 1.5px solid var(--border);
    }
    .btn-copy:hover { background: #E2E8F0; }
    .btn-copy:disabled { background: #F1F5F9; }

    .error-msg {
      color: var(--error); font-size: 12px; margin-top: 8px;
      min-height: 16px; line-height: 1.4;
    }

    .output {
      margin-top: 16px; padding: 14px 16px;
      background: var(--primary-light); border-radius: 8px;
      border: 1px dashed var(--border-focus);
      display: none;
    }
    .output .label {
      font-size: 11px; color: var(--text-secondary);
      text-transform: uppercase; letter-spacing: 0.6px; font-weight: 500;
    }
    .output .value {
      font-size: 20px;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-weight: 700; color: var(--primary); letter-spacing: 1.5px;
      margin-top: 2px; word-break: break-all;
    }

    .history { margin-top: 20px; }
    .history-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px;
    }
    .history h2 { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
    .history .clear-btn {
      font-size: 11px; color: var(--text-secondary); background: none;
      border: none; cursor: pointer; text-decoration: underline;
      padding: 2px 4px;
    }
    .history .clear-btn:hover { color: var(--error); }
    .history-list { max-height: 200px; overflow-y: auto; }
    .history-item {
      font-size: 13px; padding: 10px 0; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px;
    }
    .history-item:last-child { border-bottom: none; }
    .history-item .info { min-width: 0; }
    .history-item .device-id {
      font-weight: 600; font-size: 13px; word-break: break-all;
    }
    .history-item .date { color: var(--text-secondary); font-size: 11px; margin-top: 2px; }
    .history-item .serial {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-weight: 700; color: var(--primary); font-size: 14px;
      white-space: nowrap; flex-shrink: 0;
    }
    .empty-hint {
      font-size: 12px; color: var(--text-secondary); text-align: center;
      padding: 12px 0; font-style: italic;
    }
  </style>
</head>
<body>

  <!-- PASSWORD GATE -->
  <div class="gate-wrapper" id="gateWrapper">
    <div class="gate-card">
      <h2>🔒 Admin Access</h2>
      <p class="gate-sub">Masukkan master password untuk mengakses generator.</p>
      <input type="password" id="masterPassword" placeholder="Master password…" maxlength="128" />
      <button id="btnUnlock">Masuk</button>
      <div class="gate-error" id="gateError"></div>
    </div>
  </div>

  <!-- MAIN TOOL (hidden until unlocked) -->
  <div class="tool-wrapper" id="toolWrapper">
    <div class="card">
      <div class="header">
        <div class="icon">S</div>
        <h1>Serial Generator</h1>
      </div>
      <p class="lead">Buat nomor seri dari Device ID siswa atau guru.</p>

      <label for="deviceId">Device ID</label>
      <input type="text" id="deviceId" placeholder="Contoh: A7K3P9Q2-B4X9" maxlength="64" />

      <div class="row">
        <button id="btnGenerate" class="btn-generate" disabled>Buat Serial</button>
        <button id="btnCopy" class="btn-copy" disabled>Salin</button>
      </div>
      <div class="error-msg" id="errorMsg"></div>

      <div class="output" id="outputBox">
        <div class="label">Serial Number</div>
        <div class="value" id="output"></div>
      </div>

      <div class="history">
        <div class="history-header">
          <h2>Riwayat</h2>
          <button class="clear-btn" id="btnClear" title="Hapus semua riwayat">Hapus semua</button>
        </div>
        <div class="history-list" id="historyList"></div>
      </div>
    </div>
  </div>

<script>
(function() {
  'use strict';

  // =============================================
  // SECURITY: Dynamic salt derived from master password
  // Without the password, serials cannot be generated.
  // =============================================
  const SALT_PEPPER = 'AbsenKu_PEPPER_2025_xKq9';  // public pepper — fine to ship
  let adminHash = null;  // SHA-256 of master password — used as the real salt

  async function sha256(str) {
    const data = new TextEncoder().encode(str);
    const buf = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  async function generateSerial(deviceId) {
    if (!adminHash) throw new Error('Belum terotentikasi.');
    // salt = password hash + public pepper — neither alone is enough
    const salt = adminHash + SALT_PEPPER;
    const hash = await sha256(deviceId + salt);
    return hash.substring(0, 8).toUpperCase();
  }

  // =============================================
  // DOM refs
  // =============================================
  const $gateWrapper   = document.getElementById('gateWrapper');
  const $masterPw      = document.getElementById('masterPassword');
  const $btnUnlock     = document.getElementById('btnUnlock');
  const $gateError     = document.getElementById('gateError');
  const $toolWrapper   = document.getElementById('toolWrapper');
  const $devInput      = document.getElementById('deviceId');
  const $btnGen        = document.getElementById('btnGenerate');
  const $btnCopy       = document.getElementById('btnCopy');
  const $outBox        = document.getElementById('outputBox');
  const $outVal        = document.getElementById('output');
  const $errMsg        = document.getElementById('errorMsg');
  const $histList      = document.getElementById('historyList');
  const $btnClear      = document.getElementById('btnClear');

  // =============================================
  // PASSWORD GATE
  // =============================================
  $btnUnlock.addEventListener('click', unlock);
  $masterPw.addEventListener('keydown', function(e) { if (e.key === 'Enter') unlock(); });

  async function unlock() {
    const pw = $masterPw.value.trim();
    if (!pw) { $gateError.textContent = 'Masukkan password.'; return; }
    $gateError.textContent = 'Memverifikasi…';
    $btnUnlock.disabled = true;
    try {
      adminHash = await sha256(pw);
      // Quick sanity: derive a known check value so user knows password is right
      // We accept any non-empty password — the salt changes based on input.
      // In production you'd verify against a stored hash, but for a
      // client-only tool this ensures the operator must know the password.
      $gateWrapper.style.display = 'none';
      $toolWrapper.style.display = 'block';
      renderHistory(loadHistory());
      $devInput.focus();
    } catch(e) {
      $gateError.textContent = 'Gagal memproses password.';
    } finally {
      $btnUnlock.disabled = false;
    }
  }

  // =============================================
  // HISTORY (localStorage)
  // =============================================
  const LS_KEY = 'absenku_history';

  function loadHistory() {
    try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); }
    catch(_) { return []; }
  }

  function saveHistoryEntry(deviceId, serial) {
    const hist = loadHistory();
    hist.unshift({ deviceId: deviceId, serial: serial, date: new Date().toLocaleString('id-ID') });
    if (hist.length > 50) hist.length = 50;
    localStorage.setItem(LS_KEY, JSON.stringify(hist));
    renderHistory(hist);
  }

  function clearHistory() {
    localStorage.removeItem(LS_KEY);
    renderHistory([]);
  }

  // SECURITY FIX: No innerHTML — build DOM nodes safely via textContent
  function renderHistory(hist) {
    $histList.textContent = '';
    if (!hist || hist.length === 0) {
      var hint = document.createElement('div');
      hint.className = 'empty-hint';
      hint.textContent = 'Belum ada riwayat.';
      $histList.appendChild(hint);
      return;
    }
    hist.forEach(function(h) {
      var row = document.createElement('div');
      row.className = 'history-item';

      var info = document.createElement('div');
      info.className = 'info';

      var device = document.createElement('div');
      device.className = 'device-id';
      device.textContent = h.deviceId;

      var date = document.createElement('div');
      date.className = 'date';
      date.textContent = h.date;

      info.appendChild(device);
      info.appendChild(date);

      var serial = document.createElement('div');
      serial.className = 'serial';
      serial.textContent = h.serial;

      row.appendChild(info);
      row.appendChild(serial);
      $histList.appendChild(row);
    });
  }

  // =============================================
  // GENERATE
  // =============================================
  $devInput.addEventListener('input', function() {
    $errMsg.textContent = '';
    $btnGen.disabled = $devInput.value.trim().length < 1;
  });

  $btnGen.addEventListener('click', async function() {
    var dev = $devInput.value.trim();
    if (!dev) { $errMsg.textContent = 'Device ID tidak boleh kosong.'; return; }
    $errMsg.textContent = 'Sedang generate…';
    $btnGen.disabled = true;
    try {
      var serial = await generateSerial(dev);
      $outVal.textContent = serial;
      $outBox.style.display = 'block';
      $btnCopy.disabled = false;
      $errMsg.textContent = '';
      saveHistoryEntry(dev, serial);
    } catch(e) {
      $errMsg.textContent = 'Gagal generate serial.';
      $btnGen.disabled = false;
    }
  });

  // =============================================
  // COPY
  // =============================================
  $btnCopy.addEventListener('click', async function() {
    var text = $outVal.textContent;
    try {
      await navigator.clipboard.writeText(text);
    } catch(_) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    var old = $btnCopy.textContent;
    $btnCopy.textContent = '✓ Tersalin';
    setTimeout(function() { $btnCopy.textContent = old; }, 1200);
  });

  // =============================================
  // CLEAR HISTORY
  // =============================================
  $btnClear.addEventListener('click', function() {
    if (confirm('Hapus semua riwayat serial?')) clearHistory();
  });

})();
</script>
</body>
</html>
