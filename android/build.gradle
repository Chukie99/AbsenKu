// Top-level build file where you can add configuration options to the build logic
// scripts associated with the first project. For more details on how to
// configure your build environment see https://docs.gradle.org/
pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}

plugins {
    id 'com.android.application' version '8.3.0' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
    id 'com.google.dagger.hilt.android' version '2.51' apply false
    id 'kotlin-kapt' version '1.9.24'
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
